server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: user-service
          uri: http://user-service:8081
          predicates:
            - Path=/api/users/**
        - id: product-service
          uri: http://product-service:8082
          predicates:
            - Path=/api/products/**
        - id: cart-service
          uri: http://cart-service:8083
          predicates:
            - Path=/api/cart/**
        - id: order-service
          uri: http://order-service:8084
          predicates:
            - Path=/api/orders/**
        - id: payment-service
          uri: http://payment-service:8085
          predicates:
            - Path=/api/payments/**
        - id: notification-service
          uri: http://notification-service:8086
          predicates:
            - Path=/api/notifications/**
        - id: wishlist-service
          uri: http://wishlist-service:8087
          predicates:
            - Path=/api/wishlist/**
        - id: review-service
          uri: http://review-service:8088
          predicates:
            - Path=/api/reviews/**
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods: "*"
            allowedHeaders: "*"

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  metrics:
    tags:
      application: ${spring.application.name}
